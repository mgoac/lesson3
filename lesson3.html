<!DOCTYPE html>
<html>

<head>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

</head>

<body>
    
    <a-scene background="white">

    <a-assets>
    <img id="for" src="images/forest.jpg">
    <img id="TV" src="images/TV.jpg">
    <img id="key" src="images/keyboard.jpg">
    <img id="mouse" src="images/mouse.jpg">
    <img id="pc" src="images/pc.jpg">
    </a-assets>

    <a-curvedimage src="#for" radius="6" theta-length="50" height="5" rotation="0 90 0" scale="1.2 1.2 1.2"></a-curvedimage> 
    <a-curvedimage position = "-10 0 -10" src="#TV" radius="7" theta-length="50" height="3" rotation="0 360 0" scale="1.2 1.2 1.2"></a-curvedimage>
    <a-curvedimage position="-10 0 -10" src="#key" radius="7" theta-length="60" height="3" rotation="40 0 -10" scale="1.2 1.2 1.2"></a-curvedimage>
    <a-curvedimage position="-15 0 -8" src="#mouse" radius="7" theta-length="48" height="3" rotation="40 0 -10" scale="1.2 1.2 1.2"></a-curvedimage>
    <a-curvedimage position = "-17 0 -10" src="#pc" radius="7" theta-length="50" height="3" rotation="0 360 0" scale="1.2 1.2 1.2"></a-curvedimage>
    </a-scene>

</body>
